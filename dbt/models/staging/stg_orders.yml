version: 2

models:
  - name: stg_orders
    description: One row per order, cleaned column names, no filtering or business logic applied.
    columns:
      - name: order_id
        data_tests:
          - unique
          - not_null

      - name: customer_id
        data_tests:
          - not_null

      - name: status
        data_tests:
          - accepted_values:
              values:
                - delivered
                - shipped
                - canceled
                - unavailable
                - invoiced
                - processing
                - created
                - approved

      - name: purchased_at
        data_tests:
          - not_null

      - name: estimated_delivery_at
        data_tests:
          - not_null
