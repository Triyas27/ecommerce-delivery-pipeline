version: 2

models:
  - name: stg_customers
    description: One row per order-level customer record. Note customer_id is unique per order; customer_unique_id identifies the actual person and repeats across orders.
    columns:
      - name: customer_id
        data_tests:
          - unique
          - not_null
      - name: customer_unique_id
        data_tests:
          - not_null

  - name: stg_order_items
    description: One row per line item per order. Grain is (order_id, item_number), not order_id alone.
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: item_number
        data_tests:
          - not_null
      - name: product_id
        data_tests:
          - not_null
      - name: seller_id
        data_tests:
          - not_null
      - name: price
        data_tests:
          - not_null

  - name: stg_order_payments
    description: One row per payment installment per order. An order can have multiple payment rows.
    columns:
      - name: order_id
        data_tests:
          - not_null
      - name: payment_value
        data_tests:
          - not_null

  - name: stg_order_reviews
    description: One row per review. review_id is not unique (Olist data quirk), so no uniqueness test on it.
    columns:
      - name: review_id
        data_tests:
          - not_null
      - name: order_id
        data_tests:
          - not_null
      - name: review_score
        data_tests:
          - not_null
          - accepted_values:
              values: [1, 2, 3, 4, 5]

  - name: stg_products
    columns:
      - name: product_id
        data_tests:
          - unique
          - not_null

  - name: stg_sellers
    columns:
      - name: seller_id
        data_tests:
          - unique
          - not_null

  - name: stg_geolocation
    description: Crowd-sourced geocoding samples, multiple rows per zip_code_prefix by design. No uniqueness test on zip_code_prefix.
    columns:
      - name: zip_code_prefix
        data_tests:
          - not_null

  - name: stg_product_category_translation
    columns:
      - name: product_category_name
        data_tests:
          - unique
          - not_null
